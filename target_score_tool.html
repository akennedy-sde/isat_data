            padding: 20px;
        }
        
        .container {

            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {

            margin-bottom: 30px;
            font-size: 28px;
            text-align: center;
        }
        
        .form-group {

        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        
        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #024d99;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #024d99 0%, #002742 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 6px;
            text-align: center;
            display: none;
        }
        
        .result.show {
            display: block;
        }
        
        .result-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .result-value {
            color: #024d99;
            font-size: 36px;
            font-weight: 700;
        }
        
        .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        
        .error.show {

    </style>

        function calculateTarget() {
            const subject = document.getElementById('subject').value.toLowerCase();
            const grade = parseInt(document.getElementById('grade').value);
            const score = parseInt(document.getElementById('score').value);
            
            const errorDiv = document.getElementById('error');
            const resultDiv = document.getElementById('result');
            
            errorDiv.classList.remove('show');
            resultDiv.classList.remove('show');
            
            if (!subject || !grade || !score) {
                errorDiv.textContent = 'Please fill in all fields';
                errorDiv.classList.add('show');
                return;
            }
            
            const filtered = data.filter(row => 
                row.Subject.toLowerCase() === subject && row.Grade === grade
            );
            
            if (filtered.length === 0) {
                errorDiv.textContent = 'No data found for this subject and grade';
                errorDiv.classList.add('show');
                return;
            }
            
            const matches = filtered.filter(row => score <= row.Max_Score);
            
            if (matches.length === 0) {
                errorDiv.textContent = 'Score is above the available range';
                errorDiv.classList.add('show');
                return;
            }
            
            const target = matches[0].Target;
            document.getElementById('resultValue').textContent = target;
            resultDiv.classList.add('show');
        }
        
        // Allow Enter key to trigger calculation
        document.getElementById('score').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                calculateTarget();
            }
